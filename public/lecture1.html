<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lecture 1 slides | Embodied AI with Web-Scale Video Data</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f4;
        color: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      header {
        min-height: 3.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1rem;
        background: #fff;
        border-bottom: 1px solid #d6d3d1;
      }

      header strong {
        flex: 1;
      }

      a {
        color: #005eb8;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      #download[hidden] {
        display: none;
      }

      main {
        height: calc(100vh - 3.5rem);
      }

      #status {
        margin: 0;
        padding: 3rem 1rem;
        text-align: center;
        color: #57534e;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="./">← Course</a>
      <strong>Lecture 1 slides</strong>
      <a id="download" download="lecture1.pdf" hidden>Download PDF</a>
    </header>
    <main>
      <p id="status" role="status">Loading the Lecture 1 slides…</p>
      <iframe id="viewer" title="Lecture 1 slides" hidden></iframe>
    </main>
    <script type="module">
      const partCount = 20;
      const partUrls = Array.from(
        { length: partCount },
        (_, index) => `./lecture1-parts-b64/lecture1.part.${String(index).padStart(2, "0")}.b64`,
      );
      const status = document.querySelector("#status");
      const viewer = document.querySelector("#viewer");
      const download = document.querySelector("#download");

      try {
        const responses = await Promise.all(partUrls.map((url) => fetch(url)));
        const failed = responses.find((response) => !response.ok);
        if (failed) throw new Error(`Unable to load slide data (${failed.status})`);

        const encodedParts = await Promise.all(responses.map((response) => response.text()));
        const buffers = encodedParts.map((encoded) => {
          const binary = atob(encoded);
          return Uint8Array.from(binary, (character) => character.charCodeAt(0));
        });
        const pdfUrl = URL.createObjectURL(new Blob(buffers, { type: "application/pdf" }));

        viewer.src = `${pdfUrl}#view=FitH`;
        viewer.hidden = false;
        download.href = pdfUrl;
        download.hidden = false;
        status.hidden = true;
        window.addEventListener("beforeunload", () => URL.revokeObjectURL(pdfUrl), { once: true });
      } catch (error) {
        status.textContent = "The slides could not be loaded. Please return to the course page and try again.";
        console.error(error);
      }
    </script>
  </body>
</html>
